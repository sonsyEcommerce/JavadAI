spring:
  application:
    name: javadAI

  datasource:
    url: jdbc:postgresql://localhost:5432/javadai
    username: ${DB_USERNAME:javadai_user}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
javadai:
  workspace: ${JAVADAI_WORKSPACE:D:/JavadAI/workspace}
  ollama:
    url: http://localhost:11434
    model: qwen2.5-coder:7b
server:
  port: 8081
